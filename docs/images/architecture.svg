<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'Inter', sans-serif" role="img" aria-labelledby="arch-title">
  <title id="arch-title">tunnelmesh architecture: coordinator with two peers connected via encrypted tunnel</title>
  <rect width="100%" height="100%" fill="#0a1018"/>
  <defs>
    <marker id="arrow-forward" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0 8 3 0 6" fill="#00d4b4"/>
    </marker>
    <marker id="arrow-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0 0 3 8 6" fill="#00d4b4"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0 8 3 0 6" fill="rgba(232,234,240,0.35)"/>
    </marker>
  </defs>

  <!-- Coordinator box -->
  <rect x="20" y="20" width="560" height="90" rx="6" fill="#0c1220" stroke="rgba(0,212,180,0.3)" stroke-width="1.5"/>
  <text x="300" y="42" text-anchor="middle" dominant-baseline="middle" fill="#00d4b4" font-size="14" font-weight="bold">Coordinator</text>
  <text x="40" y="63" fill="rgba(232,234,240,0.52)" font-size="12">&#x2022; Peer discovery &amp; IP allocation</text>
  <text x="40" y="80" fill="rgba(232,234,240,0.52)" font-size="12">&#x2022; Relay fallback (WebSocket)</text>
  <text x="310" y="63" fill="rgba(232,234,240,0.52)" font-size="12">&#x2022; Mesh DNS (node.tm &#x2192; 100.42.x.x)</text>
  <text x="310" y="80" fill="rgba(232,234,240,0.52)" font-size="12">&#x2022; Hole-punch coordination &#xb7; Admin UI</text>

  <!-- Lines from coordinator bottom to peer tops -->
  <line x1="110" y1="110" x2="140" y2="178" stroke="rgba(232,234,240,0.25)" stroke-width="1" marker-end="url(#arrow-muted)"/>
  <line x1="490" y1="110" x2="460" y2="178" stroke="rgba(232,234,240,0.25)" stroke-width="1" marker-end="url(#arrow-muted)"/>

  <!-- Dashed center line: coordinator-assisted discovery -->
  <line x1="300" y1="110" x2="300" y2="162" stroke="rgba(232,234,240,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="308" y="143" fill="rgba(232,234,240,0.35)" font-size="11">register &#xb7; heartbeat &#xb7; discovery</text>

  <!-- Peer A -->
  <rect x="40" y="180" width="200" height="60" rx="6" fill="#0c1220" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="140" y="204" text-anchor="middle" dominant-baseline="middle" fill="#e8eaf0" font-size="14">Peer A</text>
  <text x="140" y="225" text-anchor="middle" fill="rgba(232,234,240,0.38)" font-size="10.5">100.42.0.1 &#xb7; TUN &#xb7; Noise IKpsk2</text>

  <!-- Peer B -->
  <rect x="360" y="180" width="200" height="60" rx="6" fill="#0c1220" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="460" y="204" text-anchor="middle" dominant-baseline="middle" fill="#e8eaf0" font-size="14">Peer B</text>
  <text x="460" y="225" text-anchor="middle" fill="rgba(232,234,240,0.38)" font-size="10.5">100.42.0.2 &#xb7; TUN &#xb7; Noise IKpsk2</text>

  <!-- Bidirectional accent arrow: direct encrypted tunnel -->
  <text x="300" y="213" text-anchor="middle" fill="rgba(232,234,240,0.52)" font-size="11">UDP &#xb7; SSH &#xb7; Relay</text>
  <line x1="248" y1="225" x2="352" y2="225" stroke="#00d4b4" stroke-width="1.5" marker-start="url(#arrow-back)" marker-end="url(#arrow-forward)"/>
</svg>
